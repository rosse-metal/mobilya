<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AR Mobilya</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Montserrat:wght@300;500&display=swap');
    :root { --gold:#d4a830; --gold-dim:#b8860b; --cream:#f5f0e8; --glass:rgba(10,10,10,.65); }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#000;overflow:hidden;width:100vw;height:100dvh;font-family:'Montserrat',sans-serif;}
    #cam-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
    #ar-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
    #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;}
    #crosshair svg{width:60px;height:60px;animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
    #top-bar{position:fixed;top:0;left:0;right:0;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;z-index:10;}
    #logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--cream);letter-spacing:.15em;text-transform:uppercase;}
    #logo b{color:var(--gold);font-weight:600;}
    #counter-badge{background:rgba(184,134,11,.2);border:1px solid var(--gold-dim);border-radius:20px;padding:4px 14px;font-size:11px;letter-spacing:.1em;color:var(--gold);display:none;}
    #toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.8);backdrop-filter:blur(12px);border:1px solid rgba(212,168,48,.35);border-radius:12px;padding:9px 20px;color:var(--cream);font-size:11px;letter-spacing:.08em;white-space:nowrap;z-index:10;transition:opacity .5s;}
    #bottom-panel{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 28px;z-index:10;background:linear-gradient(to top,rgba(0,0,0,.85) 60%,transparent);}
    #obj-label{font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;padding-left:2px;}
    #picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:12px;}
    #picker::-webkit-scrollbar{display:none;}
    .obj-btn{flex:0 0 auto;width:70px;height:70px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:var(--glass);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all .2s;color:var(--cream);}
    .obj-btn.active{border-color:var(--gold);background:rgba(184,134,11,.2);box-shadow:0 0 18px rgba(212,168,48,.25);}
    .obj-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
    .obj-btn span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#999;}
    .obj-btn.active span{color:var(--gold);}
    #actions{display:flex;gap:8px;}
    .act-btn{flex:1;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:var(--glass);backdrop-filter:blur(10px);color:var(--cream);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;}
    .act-btn:active{transform:scale(.95);}
    #place-btn{flex:2.2;border-color:var(--gold-dim);background:rgba(184,134,11,.22);color:var(--gold);font-size:12px;}
    #perm-screen{position:fixed;inset:0;background:#0a0a0a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;text-align:center;}
    #perm-screen h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--gold);}
    #perm-screen p{color:#aaa;font-size:13px;line-height:1.8;max-width:280px;}
    .cam-icon{width:72px;height:72px;border:2px solid var(--gold-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:glow 2s ease-in-out infinite;}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(212,168,48,0);}50%{box-shadow:0 0 24px 8px rgba(212,168,48,.25);}}
    #start-btn{padding:14px 36px;border-radius:10px;border:1px solid var(--gold-dim);background:rgba(184,134,11,.18);color:var(--gold);font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:8px;}
    #start-btn:active{transform:scale(.96);}
    #error-msg{color:#e05555;font-size:12px;display:none;max-width:260px;line-height:1.7;}
    #rotate-tip{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);color:rgba(212,168,48,.6);font-size:10px;letter-spacing:.12em;text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap;}
  </style>
</head>
<body>

<video id="cam-video" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>

<div id="crosshair">
  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="20" stroke="#d4a830" stroke-width="1.2" fill="none"/>
    <line x1="30" y1="4" x2="30" y2="16" stroke="#d4a830" stroke-width="1.2"/>
    <line x1="30" y1="44" x2="30" y2="56" stroke="#d4a830" stroke-width="1.2"/>
    <line x1="4" y1="30" x2="16" y2="30" stroke="#d4a830" stroke-width="1.2"/>
    <line x1="44" y1="30" x2="56" y2="30" stroke="#d4a830" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="2.5" fill="#d4a830"/>
  </svg>
</div>

<div id="top-bar">
  <div id="logo">AR<b>Space</b></div>
  <div id="counter-badge">0 nesne</div>
</div>

<div id="toast">📐 Kamerayı yüzeye doğrultun, sonra Yerleştir'e basın</div>
<div id="rotate-tip">Cihazı yatay tutun</div>

<div id="bottom-panel">
  <div id="obj-label">Nesne Seç</div>
  <div id="picker">
    <button class="obj-btn active" data-id="koltuk" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="8" rx="3"/><rect x="4" y="7" width="4" height="5" rx="1.5"/><rect x="16" y="7" width="4" height="5" rx="1.5"/><line x1="6" y1="18" x2="6" y2="21"/><line x1="18" y1="18" x2="18" y2="21"/></svg>
      <span>Koltuk</span>
    </button>
    <button class="obj-btn" data-id="masa" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="3" rx="1"/><line x1="6" y1="12" x2="6" y2="20"/><line x1="18" y1="12" x2="18" y2="20"/></svg>
      <span>Masa</span>
    </button>
    <button class="obj-btn" data-id="sandalye" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="6" rx="1.5"/><line x1="8" y1="16" x2="8" y2="21"/><line x1="16" y1="16" x2="16" y2="21"/><rect x="7" y="4" width="10" height="7" rx="1.5" fill="none"/></svg>
      <span>Sandalye</span>
    </button>
    <button class="obj-btn" data-id="dolap" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/><circle cx="10" cy="12" r="1"/><circle cx="14" cy="12" r="1"/></svg>
      <span>Dolap</span>
    </button>
    <button class="obj-btn" data-id="lamba" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><path d="M9 2h6l-1 8H10z"/><path d="M8 10h8l-2 5H10z"/><line x1="12" y1="15" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
      <span>Lamba</span>
    </button>
    <button class="obj-btn" data-id="raf" onclick="selectObj(this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="2"/><rect x="2" y="12" width="20" height="2"/><rect x="2" y="19" width="20" height="2"/><line x1="5" y1="5" x2="5" y2="21"/><line x1="19" y1="5" x2="19" y2="21"/></svg>
      <span>Raf</span>
    </button>
  </div>
  <div id="actions">
    <button class="act-btn" onclick="undoLast()">↩ Geri Al</button>
    <button class="act-btn" id="place-btn" onclick="placeObject()">✦ Yerleştir</button>
    <button class="act-btn" onclick="clearAll()">✕ Temizle</button>
  </div>
</div>

<div id="perm-screen">
  <div class="cam-icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a830" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
  </div>
  <h1>ARSpace</h1>
  <p>Gerçek dünyaya 3D mobilya yerleştirmek için kamera erişimi gerekiyor.</p>
  <button id="start-btn" onclick="startCamera()">📷 Kamerayı Aç</button>
  <p id="error-msg"></p>
  <p style="font-size:11px;color:#555;margin-top:4px;">HTTPS veya localhost gerektirir</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── THREE SETUP ──
const canvas = document.getElementById('ar-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const cam3 = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
cam3.position.set(0, 1.6, 3);
cam3.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(2, 4, 2);
scene.add(dir);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  cam3.aspect = window.innerWidth / window.innerHeight;
  cam3.updateProjectionMatrix();
});

// ── MATERIALS ──
const M = {
  wood:  new THREE.MeshLambertMaterial({color:0xC8A96E}),
  dark:  new THREE.MeshLambertMaterial({color:0x7A5F38}),
  brown: new THREE.MeshLambertMaterial({color:0x8B6F47}),
  grey:  new THREE.MeshLambertMaterial({color:0x999}),
  shade: new THREE.MeshLambertMaterial({color:0xF0E0B0,side:THREE.DoubleSide}),
  red:   new THREE.MeshLambertMaterial({color:0x8B3A3A}),
  blue:  new THREE.MeshLambertMaterial({color:0x3A5F8B}),
  metal: new THREE.MeshLambertMaterial({color:0x666}),
  emit:  new THREE.MeshLambertMaterial({color:0xFFFDE0,emissive:0xFFEE88,emissiveIntensity:.5}),
  gold:  new THREE.MeshLambertMaterial({color:0xB8860B}),
};

function bx(w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return o;}
function cy(r,h,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);return o;}
function cn(rt,rb,h,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),m);o.position.set(x,y,z);return o;}
function sp(r,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,10),m);o.position.set(x,y,z);return o;}

const BUILDERS = {
  koltuk:()=>{
    const g=new THREE.Group();
    g.add(bx(.7,.12,.6,M.brown,0,.2,0));
    g.add(bx(.7,.6,.08,M.dark,0,.55,-.26));
    g.add(bx(.08,.32,.6,M.dark,.35,.38,0));
    g.add(bx(.08,.32,.6,M.dark,-.35,.38,0));
    [[.28,.25],[.28,-.25],[-.28,.25],[-.28,-.25]].forEach(([x,z])=>g.add(cy(.025,.15,M.wood,x,.07,z)));
    return g;
  },
  masa:()=>{
    const g=new THREE.Group();
    g.add(bx(1.2,.05,.7,M.wood,0,.4,0));
    [[.5,.25],[.5,-.25],[-.5,.25],[-.5,-.25]].forEach(([x,z])=>g.add(bx(.06,.4,.06,M.dark,x,.2,z)));
    return g;
  },
  sandalye:()=>{
    const g=new THREE.Group();
    g.add(bx(.45,.05,.42,M.wood,0,.22,0));
    g.add(bx(.45,.6,.05,M.dark,0,.55,-.19));
    [[.18,.16],[.18,-.16],[-.18,.16],[-.18,-.16]].forEach(([x,z])=>g.add(cy(.02,.22,M.dark,x,.1,z)));
    return g;
  },
  dolap:()=>{
    const g=new THREE.Group();
    g.add(bx(.8,1.2,.4,M.wood,0,.6,0));
    g.add(bx(.01,1.15,.41,M.dark,0,.6,0));
    g.add(sp(.025,M.gold,-.06,.6,.21));
    g.add(sp(.025,M.gold,.06,.6,.21));
    return g;
  },
  lamba:()=>{
    const g=new THREE.Group();
    g.add(cy(.12,.05,M.grey,0,.025,0));
    g.add(cy(.02,1.5,M.metal,0,.85,0));
    g.add(cn(.08,.25,.35,M.shade,0,1.7,0));
    g.add(sp(.06,M.emit,0,1.62,0));
    return g;
  },
  raf:()=>{
    const g=new THREE.Group();
    [.1,.55,1.0].forEach(y=>g.add(bx(1,.04,.25,M.wood,0,y,0)));
    [-.47,.47].forEach(x=>{
      g.add(bx(.04,1.1,.25,M.dark,x,.55,0));
      g.add(bx(.06,.18,.2,M.red,x*.5,.68,0));
      g.add(bx(.06,.18,.2,M.blue,x*.2,.68,0));
    });
    return g;
  },
};

// ── STATE ──
let selectedId = 'koltuk';
let placed = [];
let count = 0;
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  t += 0.007;
  cam3.position.y = 1.6 + Math.sin(t) * 0.012;
  renderer.render(scene, cam3);
}
animate();

// ── CAMERA ──
async function startCamera() {
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('start-btn');
  btn.textContent = 'Açılıyor...';
  btn.disabled = true;
  errEl.style.display = 'none';

  try {
    // Try back camera first, fallback to any
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }

    const video = document.getElementById('cam-video');
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      document.getElementById('perm-screen').style.display = 'none';
    };
  } catch(e) {
    btn.textContent = '📷 Kamerayı Aç';
    btn.disabled = false;
    errEl.style.display = 'block';
    if (e.name === 'NotAllowedError')
      errEl.textContent = '❌ İzin reddedildi. Tarayıcı adres çubuğundaki kamera simgesine tıklayıp izin verin.';
    else if (e.name === 'NotFoundError')
      errEl.textContent = '❌ Kamera bulunamadı.';
    else if (location.protocol !== 'https:' && location.hostname !== 'localhost')
      errEl.textContent = '❌ Bu özellik HTTPS gerektirir. Lütfen https:// ile açın.';
    else
      errEl.textContent = '❌ ' + e.name + ': ' + e.message;
  }
}

// ── UI ──
function selectObj(btn) {
  document.querySelectorAll('.obj-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedId = btn.dataset.id;
}

function placeObject() {
  const obj = BUILDERS[selectedId]();
  const x = (Math.random() - 0.5) * 1.4;
  const z = -1.4 - Math.random() * 0.8;
  obj.position.set(x, 2, z); // start high
  scene.add(obj);
  placed.push(obj);
  count++;
  updateCounter();

  // Drop animation
  const target = 0;
  const start = performance.now();
  (function drop() {
    const p = Math.min((performance.now() - start) / 550, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    obj.position.y = 2 + (target - 2) * ease;
    if (p < 1) requestAnimationFrame(drop);
    else obj.position.y = target;
  })();

  const toast = document.getElementById('toast');
  toast.style.opacity = '0';
  setTimeout(() => toast.style.display = 'none', 600);
}

function undoLast() {
  if (!placed.length) return;
  scene.remove(placed.pop());
  count = Math.max(0, count - 1);
  updateCounter();
}

function clearAll() {
  placed.forEach(o => scene.remove(o));
  placed = []; count = 0;
  updateCounter();
  const toast = document.getElementById('toast');
  toast.style.cssText = 'display:block;opacity:1;';
}

function updateCounter() {
  const el = document.getElementById('counter-badge');
  el.style.display = count > 0 ? 'block' : 'none';
  el.textContent = count + ' nesne';
}

// Check HTTPS
if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  document.getElementById('error-msg').textContent = '⚠️ HTTPS gereklidir. Lütfen dosyayı https:// üzerinden açın.';
  document.getElementById('error-msg').style.display = 'block';
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').style.opacity = '0.4';
}
</script>
</body>
</html>
